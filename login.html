<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - MyVideo</title>

<link rel="stylesheet" href="css/login.css">

</head>


<body>


<div class="login-container">


    <div class="logo">
        ▶ MyVideo
    </div>


    <div class="login-box">

        <h1>Entrar</h1>

        <p>Acesse sua conta do MyVideo</p>


        <input 
        id="email"
        type="email"
        placeholder="Email">


        <input
        id="password"
        type="password"
        placeholder="Senha">


        <button id="login">
            Entrar
        </button>


        <div class="divider">
            ou
        </div>


        <button class="create-account">
            Criar conta
        </button>


    </div>


</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>

<script src="js/auth.js"></script>


</body>

  </html>
