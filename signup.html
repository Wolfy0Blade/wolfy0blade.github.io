<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyVideo - Criar conta</title>
    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<div class="auth-container">

    <div class="logo">
        <span>▶</span> MyVideo
    </div>

    <h1>Criar conta</h1>
    <p>Entre no mundo do MyVideo</p>

    <input id="email" type="email" placeholder="Email">

    <input id="password" type="password" placeholder="Senha">

    <button onclick="signup()">Criar conta</button>

    <p id="message"></p>

    <div class="switch">
        Já tem uma conta?
        <a href="login.html">Entrar</a>
    </div>

</div>


<script>

const supabaseUrl = "https://wrjzjedcobxowewazeul.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndyanpqZWRjb2J4b3dld2F6ZXVsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3MDcxMDksImV4cCI6MjEwMTI4MzEwOX0.Km-yZbpNc9FowsyyZIy34UlTFM--gz7HYUTlXnE57cM";

const supabase = window.supabase.createClient(
    supabaseUrl,
    supabaseKey
);


async function signup(){

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    const message = document.getElementById("message");


    const { data, error } = await supabase.auth.signUp({
        email: email,
        password: password
    });

    if (!error) {

    await supabase
    .from("profiles")
    .insert({
        id: data.user.id,
        username: email.split("@")[0]
    });

    }


    if(error){

        message.innerText = error.message;
        message.style.color = "#ff5555";

    } else {

        message.innerText = 
        "Conta criada! Verifique seu email.";

        message.style.color = "#00aaff";

    }

}

</script>


</body>
  </html>
